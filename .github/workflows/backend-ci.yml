name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/backend-monolith/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/backend-monolith/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/backend-monolith

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './apps/backend-monolith/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter
      run: npm run lint
      
    - name: Run unit tests
      run: npm run test
      
    - name: Build application
      run: npm run build